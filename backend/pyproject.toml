[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "journalai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    # pysqlcipher3 requires libsqlcipher-dev at build time.
    # If pysqlcipher3 fails to compile (e.g., new Python/SQLCipher combo),
    # try sqlcipher3-wheels as a drop-in: pip install sqlcipher3-wheels
    # Both expose the same sqlite3-compatible API.
    "pysqlcipher3>=1.2.0",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "python-multipart>=0.0.12",
    "openai>=1.54",
    "httpx>=0.27",
    "cryptography>=43.0",
    "slowapi>=0.1.9",
    "qrcode[pil]>=7.4",
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-qrcode",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # pytest uses assert

[tool.ruff.lint.per-file-ignores]
# Tests: allow broad pytest.raises, hardcoded test passwords, unused loop vars,
# long strings in test fixtures, try/except/pass in teardown helpers, mid-file
# imports for test-specific setup paths.
"tests/**" = ["B017", "S105", "S106", "S110", "B007", "E501", "E402", "F821"]
# Alembic env.py has unavoidable mid-file imports (config must be set up between
# imports and the actual migration runner).
"alembic/env.py" = ["E402", "I001"]
# SQLAlchemy models use string-forward-references for relationship targets —
# ruff doesn't resolve them (F821). The B008 in some routes/models is intentional
# (Depends(...) pattern). import_.py splits parse-only imports from apply-imports
# by design (E402).
"app/models/*" = ["F821"]
"app/services/import_.py" = ["E402"]
"app/routes/*" = ["B008"]
"app/services/tts.py" = ["B008", "S110"]
"app/services/export.py" = ["E501"]
"app/db.py" = ["E402", "S110"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

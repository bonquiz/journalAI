server {
  listen 80;
  root /usr/share/nginx/html;

  # SPA fallback — any non-file route falls through to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Service worker must NEVER be cached, so updates propagate
  location = /service-worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # Long-cache for built assets (hashed filenames)
  location /_app/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}

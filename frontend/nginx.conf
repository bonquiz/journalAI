server {
  listen 8080;
  root /usr/share/nginx/html;

  # SPA fallback — any non-file route falls through to index.html.
  # The HTML shell must be revalidated on every load (no-cache, not no-store:
  # a 304 is cheap). Otherwise the browser serves a stale index.html straight
  # from cache without a network request — so an expired Cloudflare Access
  # token never triggers its 302 to the login page and the user just sees a
  # blank/old page. See CLAUDE.md "Cache-Poisoning".
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # Service worker must NEVER be cached, so updates propagate
  location = /service-worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # Long-cache for built assets (hashed filenames)
  location /_app/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}

name: journalai

services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  backend:
    build: ../backend
    env_file:
      - ./.env
    volumes:
      - ../data:/app/data
    restart: unless-stopped

  frontend:
    build: ../frontend
    restart: unless-stopped

volumes:
  caddy_data: {}
  caddy_config: {}

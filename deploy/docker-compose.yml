name: journalai

services:
  caddy:
    image: caddy:2
    container_name: journalai-caddy
    # By default no host ports are published. The upstream gateway (Cloudflare
    # Tunnel, reverse proxy, etc.) is expected to reach this container on the
    # docker network. Operators on a standalone box can uncomment the ports
    # block to expose :80/:443 directly.
    # ports:
    #   - "80:80"
    #   - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # Default: Caddy terminates TLS and auto-provisions via Let's Encrypt.
      # Set CADDY_SCHEME=http:// in .env when a tunnel/proxy terminates TLS
      # upstream, so Caddy serves plain HTTP without a redirect loop.
      CADDY_SCHEME: ${CADDY_SCHEME:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # still needed for :80/:443 when ports are uncommented
    networks:
      - default
      - gateway

  backend:
    build: ../backend
    container_name: journalai-backend
    env_file:
      - ./.env
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m

  frontend:
    build: ../frontend
    container_name: journalai-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /var/cache/nginx:size=32m
      - /var/run:size=4m

networks:
  default:
  gateway:
    # External network where the upstream tunnel/proxy lives. Must already
    # exist — create with: `docker network create gateway`. Override the name
    # via COMPOSE_GATEWAY_NETWORK in .env if your gateway uses a different one
    # (e.g. "n8n-stack_web" for a combined n8n+cloudflared stack).
    external: true
    name: ${COMPOSE_GATEWAY_NETWORK:-gateway}

volumes:
  caddy_data: {}
  caddy_config: {}
